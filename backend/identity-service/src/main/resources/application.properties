server.port=8081
spring.application.name=identity-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecospend_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecospend_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:EcoSpend@2025!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:ecospend-super-secret-jwt-key-minimum-512-bits-long-enough-for-hs512-signing}
jwt.expiry-ms=${JWT_EXPIRY_MS:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# Actuator
management.endpoints.web.exposure.include=health