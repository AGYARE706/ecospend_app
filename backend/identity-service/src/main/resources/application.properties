server.port=8081
spring.application.name=identity-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ecospend_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ecospend_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:EcoSpend@2025!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET:ecospend-super-secret-jwt-key-minimum-512-bits-long-enough-for-hs512-signing}
jwt.expiry-ms=${JWT_EXPIRY_MS:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY_MS:604800000}

# OTP delivery by email (registration, password reset, login 2FA).
# provider=console (default) logs the code to stdout instead of sending it —
# no account/cost needed for local dev or a demo. Set provider=brevo plus the
# Brevo SMTP settings below to send real email (free tier: 300 emails/day).
otp.email.provider=${OTP_EMAIL_PROVIDER:console}
# Brevo SMTP (https://app.brevo.com → SMTP & API → SMTP). The username is
# your Brevo account login; the password is the generated SMTP key (NOT the
# account password). from-email must be a verified sender/domain in Brevo.
spring.mail.host=${BREVO_SMTP_HOST:smtp-relay.brevo.com}
spring.mail.port=${BREVO_SMTP_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
brevo.from-email=${BREVO_FROM_EMAIL:}
brevo.from-name=${BREVO_FROM_NAME:EcoSpend}

# Actuator
management.endpoints.web.exposure.include=health

engagement-service.base-url=${ENGAGEMENT_SERVICE_URL:http://engagement-service:8086}

# Profile photos are uploaded as base64 JSON (up to ~1.5MB text) — give
# the connector headroom above Tomcat's 2MB default so a max-size photo
# plus JSON overhead never gets truncated.
server.tomcat.max-swallow-size=4MB
server.tomcat.max-http-form-post-size=4MB