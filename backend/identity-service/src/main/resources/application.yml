server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: identity-service

  datasource:
    # Use 'postgres' (the docker-compose service name)
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecospend}
    username: ${SPRING_DATASOURCE_USERNAME:ecospend}
    password: ${SPRING_DATASOURCE_PASSWORD:ecospend_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      # 'validate' prevents the app from starting if your Entity code 
      # doesn't match the actual database tables.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # This keeps your Identity tables strictly within identity_schema
        default_schema: identity_schema

  flyway:
    enabled: true
    # This prevents the Identity service from touching Expense tables
    schemas: identity_schema
    baseline-on-migrate: true
    locations: classpath:db/migration

# Security Configurations
jwt:
  secret: ${JWT_SECRET:ecospend-super-secret-jwt-key-minimum-512-bits-long-enough-for-hs512-signing}
  expiry-ms: ${JWT_EXPIRY_MS:900000}
  refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info