server:
  port: 8082

spring:
  application:
    name: expense-service
  datasource:
    # 'postgres' is the service name defined in docker-compose
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecospend}
    username: ${SPRING_DATASOURCE_USERNAME:ecospend}
    password: ${SPRING_DATASOURCE_PASSWORD:ecospend_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Crucial for Schema Isolation
        default_schema: expense_schema

  flyway:
    enabled: true
    # Tells Flyway to only manage this schema
    schemas: expense_schema
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

payment-service:
  base-url: ${PAYMENT_SERVICE_URL:http://payment-service:8085}

vault-service:
  base-url: ${VAULT_SERVICE_URL:http://vault-service:8083}

engagement-service:
  base-url: ${ENGAGEMENT_SERVICE_URL:http://engagement-service:8086}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  chat-model: claude-opus-4-8
  narration-model: claude-haiku-4-5

logging:
  level:
    org.hibernate.SQL: DEBUG