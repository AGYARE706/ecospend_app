server:
  port: 8082
  servlet:
    context-path: /api/v1 # Optional: organizes your endpoints

spring:
  application:
    name: expense-service
    
  datasource:
    # URL structure: jdbc:postgresql://[host]:[port]/[database_name]
    url: jdbc:postgresql://localhost:5332/ecospend
    username: ${DB_USER:ecospend}
    password: ${DB_PASSWORD:ecospend_dev}
    driver-class-name: org.postgresql.Driver
    
    # Connection Pool Settings (HikariCP)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    # 'update' automatically creates/updates tables to match your @Entity classes
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# Logging settings to help debug database issues
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.ecospend.expense: DEBUG
