server:
  port: 8086

spring:
  application:
    name: engagement-service
  datasource:
    # 'postgres' is the service name defined in docker-compose
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecospend}
    username: ${SPRING_DATASOURCE_USERNAME:ecospend}
    password: ${SPRING_DATASOURCE_PASSWORD:ecospend_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        # Crucial for Schema Isolation
        default_schema: engagement_schema

  flyway:
    enabled: true
    # Tells Flyway to only manage this schema
    schemas: engagement_schema
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

notification-service:
  base-url: ${NOTIFICATION_SERVICE_URL:http://notification-service:8084}

logging:
  level:
    org.hibernate.SQL: DEBUG
