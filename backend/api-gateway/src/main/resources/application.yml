server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: identity-service
          uri: http://identity-service:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1

        - id: finance-service
          uri: http://finance-service:8082
          predicates:
            - Path=/api/finance/**
          filters:
            - StripPrefix=1
            - name: AuthenticationFilter

        - id: vault-service
          uri: http://vault-service:8083
          predicates:
            - Path=/api/vault/**
          filters:
            - StripPrefix=1
            - name: AuthenticationFilter

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
