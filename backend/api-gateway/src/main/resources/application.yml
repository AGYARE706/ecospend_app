server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: expense-service
          uri: ${EXPENSE_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/expenses/**
          filters:
            - StripPrefix=1
