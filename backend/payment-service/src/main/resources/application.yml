server:
  port: 8085

spring:
  application:
    name: payment-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/ecospend}
    username: ${SPRING_DATASOURCE_USERNAME:ecospend}
    password: ${SPRING_DATASOURCE_PASSWORD:ecospend_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: payment_schema

  flyway:
    enabled: true
    schemas: payment_schema
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

paystack:
  # Blank secret key runs the service in simulated mode: deposits verify
  # instantly and transfers auto-succeed — no Paystack account required.
  # Set a sk_test_... key to exercise the real Paystack test API.
  secret-key: ${PAYSTACK_SECRET_KEY:}
  base-url: ${PAYSTACK_BASE_URL:https://api.paystack.co}
  # Where Paystack redirects the browser after checkout (deep link back into the app).
  callback-url: ${PAYSTACK_CALLBACK_URL:ecospend://payments/callback}

vault-service:
  base-url: ${VAULT_SERVICE_URL:http://vault-service:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
