services:
  postgres:
    image: postgres:16-alpine
    container_name: ecospend-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build: ./backend/user-service
    container_name: ecospend-user-service
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${USER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  expense-service:
    build: ./backend/expense-service
    container_name: ecospend-expense-service
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${EXPENSE_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./backend/api-gateway
    container_name: ecospend-api-gateway
    env_file: .env
    environment:
      USER_SERVICE_URL: http://user-service:8081
      EXPENSE_SERVICE_URL: http://expense-service:8082
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - user-service
      - expense-service

volumes:
  postgres_data:
