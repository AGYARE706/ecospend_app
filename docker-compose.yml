services:
  postgres:
    image: postgres:16-alpine
    container_name: ecospend-db
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-service:
    build: ./backend/identity-service
    container_name: ecospend-identity-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set a Base64 secret}
      JWT_EXPIRY_MS: ${JWT_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      ENGAGEMENT_SERVICE_URL: http://engagement-service:8086
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

  expense-service:
    build: ./backend/expense-service
    container_name: ecospend-expense-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENGAGEMENT_SERVICE_URL: http://engagement-service:8086
    ports:
      - "${EXPENSE_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy

  vault-service:
    build: ./backend/vault-service
    container_name: ecospend-vault-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ENGAGEMENT_SERVICE_URL: http://engagement-service:8086
    ports:
      - "${VAULT_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy

  engagement-service:
    build: ./backend/engagement-service
    container_name: ecospend-engagement-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${ENGAGEMENT_SERVICE_PORT:-8086}:8086"
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build: ./backend/notification-service
    container_name: ecospend-notification-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    build: ./backend/payment-service
    container_name: ecospend-payment-service
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY:-}
      PAYSTACK_CALLBACK_URL: ${PAYSTACK_CALLBACK_URL:-ecospend://payments/callback}
    ports:
      - "${PAYMENT_SERVICE_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./backend/api-gateway
    container_name: ecospend-api-gateway
    env_file: .env
    environment:
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — copy .env.example to .env and set a Base64 secret}
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    depends_on:
      - identity-service
      - expense-service
      - vault-service
      - notification-service
      - payment-service
      - engagement-service

volumes:
  postgres_data:
