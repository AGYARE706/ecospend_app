# Fast local override: use pre-built JARs instead of Maven-in-Docker builds.
# Usage: docker compose -f docker-compose.yml -f docker-compose.runtime.yml up --build -d
services:
  identity-service:
    build:
      context: ./backend/identity-service
      dockerfile: Dockerfile.runtime
  expense-service:
    build:
      context: ./backend/expense-service
      dockerfile: Dockerfile.runtime
  vault-service:
    build:
      context: ./backend/vault-service
      dockerfile: Dockerfile.runtime
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile.runtime
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile.runtime
